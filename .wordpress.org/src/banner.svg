<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <!--
    Saddle's WordPress.org banner (source art, 2026-10-23): light and quiet,
    in Saddle magenta #d000c4. The mark and name, one line on what Saddle
    does, and one card of what an owner sees: the AI asks, the owner decides.

    Render both sizes with rsvg-convert (see .wordpress.org/README.md):
      rsvg-convert -w 1544 -h 500 src/banner.svg -o banner-1544x500.png
      rsvg-convert -w  772 -h 250 src/banner.svg -o banner-772x250.png

    The mark is assets/brand/mark.svg (disc and knockout in one evenodd path).
    No app logos, and no "WordPress": listing graphics fall under the
    trademark rule (WP.org review, round 1).
  -->
  <defs>
    <radialGradient id="glow" cx="1240" cy="90" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde0fb"/>
      <stop offset="1" stop-color="#fde0fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="120" cy="560" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb8f8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffb8f8" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#a3009a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1544" height="500" fill="#fcf9fc"/>
  <rect width="1544" height="500" fill="url(#glow)"/>
  <rect width="1544" height="500" fill="url(#glow2)"/>

  <!-- Mark and name -->
  <rect x="112" y="136" width="104" height="104" rx="26" fill="#d000c4"/>
  <g transform="translate(134 158) scale(0.2143)">
    <path fill="#ffffff" fill-rule="evenodd" clip-rule="evenodd" d="M140 0C217.32 0 280 62.6801 280 140C280 217.32 217.32 280 140 280C62.6801 280 1.9021e-06 217.32 0 140C0 62.6801 62.6801 1.47276e-06 140 0ZM185.037 71.0938C167.923 71.0938 159.816 92.6963 140 92.6963C120.184 92.6963 112.077 71.0938 94.9629 71.0938C77.8491 71.0939 63.4375 85.0455 63.4375 104.848V199.358C63.4375 201.746 64.387 204.035 66.0762 205.723C67.7654 207.411 70.0564 208.359 72.4453 208.359H94.9629C97.3518 208.359 99.6428 207.411 101.332 205.723C103.021 204.035 103.971 201.746 103.971 199.358V158.854C103.971 149.305 107.767 140.147 114.523 133.395C121.28 126.643 130.445 122.85 140 122.85C149.555 122.85 158.72 126.643 165.477 133.395C172.233 140.147 176.029 149.305 176.029 158.854V199.358C176.029 201.746 176.979 204.035 178.668 205.723C180.357 207.411 182.648 208.359 185.037 208.359H207.555C209.944 208.359 212.235 207.411 213.924 205.723C215.613 204.035 216.562 201.746 216.562 199.358V104.848C216.562 85.0455 202.151 71.0939 185.037 71.0938Z"/>
  </g>
  <text x="246" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-2" fill="#111113">Saddle</text>

  <!-- What it does -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#55555f">
    <text x="114" y="314">Let your AI work on your live site</text>
    <text x="114" y="360">without handing it the keys.</text>
  </g>

  <!-- What the owner sees -->
  <g filter="url(#lift)">
    <rect x="904" y="112" width="520" height="276" rx="28" fill="#ffffff"/>
  </g>
  <rect x="904.5" y="112.5" width="519" height="275" rx="27.5" fill="none" stroke="#111113" stroke-opacity="0.06"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="944" y="172" font-size="24" font-weight="700" fill="#111113">Needs your OK</text>
    <text x="944" y="222" font-size="25" fill="#3a3a44">Your AI wants to move the page</text>
    <text x="944" y="258" font-size="25" fill="#3a3a44">“Spring sale” to the trash.</text>

    <rect x="944.5" y="292.5" width="135" height="55" rx="13.5" fill="#ffffff" stroke="#d4d4da"/>
    <text x="1012" y="328" font-size="23" font-weight="500" fill="#111113" text-anchor="middle">Reject</text>
    <rect x="1094" y="292" width="156" height="56" rx="14" fill="#d000c4"/>
    <text x="1172" y="328" font-size="23" font-weight="500" fill="#ffffff" text-anchor="middle">Approve</text>
  </g>
</svg>
